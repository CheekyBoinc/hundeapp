# Hält die auf Commit-SHAs gepinnten Actions aktuell. npm und Gradle bleiben
# außen vor, die werden gezielt von Hand gepflegt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Auch npm, damit veraltete Pakete sichtbar werden; Updates bleiben Handarbeit.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
